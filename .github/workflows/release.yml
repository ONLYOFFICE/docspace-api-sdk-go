name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get info
        id: info
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qxF "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          module=$(sed -nE 's#^module[[:space:]]+([^[:space:]]+).*$#\1#p' go.mod)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "module=$module" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Request module from Go module proxy
        env:
          MODULE: ${{ steps.info.outputs.module }}
        run: |
          # Asking proxy.golang.org for the version makes it fetch the tag from
          # GitHub, which is what gets the release onto pkg.go.dev. The proxy
          # caches a failed fetch for a while, so a long retry loop only replays
          # the cached error: warn and carry on, the GitHub release does not
          # depend on it. Any later `go get` of the version asks the proxy to
          # fetch it again.
          cd "$(mktemp -d)"
          attempt=1
          until GOPROXY=https://proxy.golang.org go list -m "$MODULE@$GITHUB_REF_NAME"; do
            if [ "$attempt" -ge 3 ]; then
              echo "::warning::$MODULE@$GITHUB_REF_NAME is not on proxy.golang.org yet, check https://pkg.go.dev/$MODULE@$GITHUB_REF_NAME later"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 30 seconds"
            attempt=$((attempt + 1))
            sleep 30
          done
          echo "$MODULE@$GITHUB_REF_NAME is available on proxy.golang.org"
          echo "https://pkg.go.dev/$MODULE@$GITHUB_REF_NAME"

      - name: Extract release notes
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          awk -v head="## $VERSION" '
            $0 == head { p = 1; next }
            /^## / { p = 0 }
            p
          ' CHANGELOG.md > RELEASE.md

      - uses: ncipollo/release-action@v1
        with:
          bodyFile: RELEASE.md
          tag: ${{ github.ref_name }}
          prerelease: ${{ contains(steps.info.outputs.version, '-') }}
